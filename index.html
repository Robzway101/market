<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Matrix Screen Saver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            background-color: #000000;
            font-family: monospace;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initializeStreams();
        }

        let streams = [];

        class CodeStream {
            constructor(x) {
                this.x = x;
                this.reset();
                this.y = Math.random() * -canvas.height;
            }

            reset() {
                this.y = Math.random() * -300 - 50;
                
                const rand = Math.random();
                // Rebalanced distribution: Reduced massive foreground rates, boosted deep background metrics
                if (rand < 0.03) {
                    // Tier 1: Giant Foreground Streams reduced from 5% down to 3%
                    this.fontSize = 24;
                    this.speed = Math.random() * 4 + 5;
                    this.glowOpacity = 0.95;
                } else if (rand < 0.08) {
                    // Tier 2: Mid-Foreground Streams reduced from 7% down to 5%
                    this.fontSize = 18;
                    this.speed = Math.random() * 3 + 4;
                    this.glowOpacity = 0.85;
                } else if (rand < 0.20) {
                    // Tier 4: Deep Background Streams increased from 10% up to 12%
                    this.fontSize = 10;
                    this.speed = Math.random() * 1 + 1.8;
                    this.glowOpacity = 0.50;
                } else if (rand < 0.34) {
                    // Tier 5: Tiny Micro-Background Streams increased from 10% up to 14%
                    this.fontSize = 7;
                    this.speed = Math.random() * 0.8 + 1.2;
                    this.glowOpacity = 0.35;
                } else {
                    // Tier 3: Standard Midground Baseline makes up the remaining 66%
                    this.fontSize = 13;
                    this.speed = Math.random() * 2 + 2.5;
                    this.glowOpacity = 0.75;
                }

                this.isGreen = Math.random() > 0.5;
                this.baseColor = this.isGreen ? 'rgba(0, 245, 100,' : 'rgba(255, 35, 55,';
                this.headColor = this.isGreen ? 'rgba(215, 255, 230, 1)' : 'rgba(255, 225, 230, 1)';
                
                const shapeRand = Math.random();
                if (shapeRand < 0.05) {
                    this.leadStyle = 'dragonfly';
                } else if (shapeRand < 0.10) {
                    this.leadStyle = 'gravestone';
                } else if (shapeRand < 0.25) {
                    this.leadStyle = 'marubozu';
                } else if (shapeRand < 0.40) {
                    this.leadStyle = 'hammer';
                } else {
                    this.leadStyle = 'standard';
                }

                this.symbols = [];
                const lengthMultiplier = this.fontSize < 11 ? 25 : 12;
                const streamLength = Math.floor(Math.random() * lengthMultiplier) + 12;
                
                for(let i = 0; i < streamLength; i++) {
                    this.symbols.push(this.generateMarketSymbol());
                }

                if (Math.random() < 0.35) {
                    this.burnoutHeight = canvas.height + 250; 
                } else {
                    this.burnoutHeight = Math.random() * (canvas.height * 0.75) + (canvas.height * 0.2);
                }
            }

            generateMarketSymbol() {
                if (Math.random() < 0.3) {
                    const bid = Math.floor(Math.random() * 99);
                    const ask = Math.floor(Math.random() * 99);
                    return { type: 'text', val: `${bid}x${ask}` };
                } else {
                    const bodyType = Math.random() > 0.4 ? "█" : "▮";
                    const topWickScale = Math.random() * 0.8 + 0.6;
                    const bottomWickScale = Math.random() * 0.8 + 0.3;
                    return { 
                        type: 'candle', 
                        val: bodyType, 
                        topWick: topWickScale, 
                        bottomWick: bottomWickScale 
                    };
                }
            }

            update() {
                this.y += this.speed;

                if (Math.random() > 0.67) {
                    const index = Math.floor(Math.random() * this.symbols.length);
                    this.symbols[index] = this.generateMarketSymbol();
                }

                if (this.y - (this.symbols.length * this.fontSize) > canvas.height || this.y > this.burnoutHeight) {
                    this.reset();
                }
            }

            draw() {
                ctx.font = `bold ${this.fontSize}px monospace`;
                ctx.textAlign = 'center';

                for (let i = this.symbols.length - 1; i > 0; i--) {
                    const charY = this.y - (i * this.fontSize);
                    if (charY < 0 || charY > canvas.height + 50) continue;

                    const alpha = (1 - (i / this.symbols.length)).toFixed(2);
                    ctx.fillStyle = `${this.baseColor}${alpha * this.glowOpacity})`;
                    ctx.shadowBlur = 0;

                    const currentItem = this.symbols[i];

                    if (currentItem.type === 'candle') {
                        ctx.strokeStyle = ctx.fillStyle;
                        ctx.lineWidth = Math.max(1.5, this.fontSize / 5.5);
                        ctx.beginPath();
                        ctx.moveTo(this.x, charY - (this.fontSize * currentItem.topWick));
                        ctx.lineTo(this.x, charY + (this.fontSize * currentItem.bottomWick));
                        ctx.stroke();
                        ctx.fillText(currentItem.val, this.x, charY);
                    } else {
                        ctx.fillText(currentItem.val, this.x, charY);
                    }
                }

                const leadY = this.y;
                if (leadY >= 0 && leadY <= canvas.height + 50) {
                    ctx.fillStyle = this.headColor;
                    ctx.strokeStyle = this.headColor;
                    ctx.lineWidth = Math.max(2, this.fontSize / 5);
                    ctx.shadowBlur = this.fontSize > 15 ? 18 : 10;
                    ctx.shadowColor = this.isGreen ? '#00ff88' : '#ff2244';

                    ctx.beginPath();
                    if (this.leadStyle === 'dragonfly') {
                        ctx.moveTo(this.x - (this.fontSize * 0.4), leadY);
                        ctx.lineTo(this.x + (this.fontSize * 0.4), leadY);
                        ctx.moveTo(this.x, leadY - (this.fontSize * 0.8));
                        ctx.lineTo(this.x, leadY + (this.fontSize * 2.2));
                        ctx.stroke();
                    } 
                    else if (this.leadStyle === 'gravestone') {
                        ctx.moveTo(this.x - (this.fontSize * 0.4), leadY);
                        ctx.lineTo(this.x + (this.fontSize * 0.4), leadY);
                        ctx.moveTo(this.x, leadY - (this.fontSize * 2.4));
                        ctx.lineTo(this.x, leadY + (this.fontSize * 0.2));
                        ctx.stroke();
                    } 
                    else if (this.leadStyle === 'marubozu') {
                        ctx.fillText("█", this.x, leadY);
                    }
                    else if (this.leadStyle === 'hammer') {
                        ctx.moveTo(this.x, leadY - (this.fontSize * 0.8));
                        ctx.lineTo(this.x, leadY + (this.fontSize * 2.5));
                        ctx.stroke();
                        ctx.fillText("▄", this.x, leadY);
                    }
                    else {
                        ctx.moveTo(this.x, leadY - (this.fontSize * 1.6));
                        ctx.lineTo(this.x, leadY + (this.fontSize * 0.7));
                        ctx.stroke();
                        ctx.fillText("█", this.x, leadY);
                    }
                }
                
                ctx.shadowBlur = 0;
            }
        }

        function initializeStreams() {
            streams = [];
            const spacing = 8.7; 
            const columns = Math.floor(canvas.width / spacing);
            
            for (let i = 0; i < columns; i++) {
                streams.push(new CodeStream(i * spacing + spacing / 2));
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.056)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let stream of streams) {
                stream.update();
                stream.draw();
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resizeCanvas);
        
        resizeCanvas();
        animate();
    </script>
</body>
</html>
